name: Publish Game Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.3.0-alpha)'
        required: false
        default: 'v0.3.0-alpha'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "BARLOVENTO ${{ github.event.inputs.tag_name || github.ref_name }} (Windows 64-bit)"
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## 🚀 BARLOVENTO v0.3.0-alpha Build

            ### ✨ Highlights:
            - **⚔ Stages 1, 2 & 3 Active Across All 3 Factions:** Play through 9 complete distinct campaign missions for Armada of Acero, The Vinculados, and La Marea Libre!
            - **🌌 Dynamic Strategic Naval Charts:** Grid topologies scaling from 8×10 narrow canyon gorges to 12×10 oceanic storm charts with spires, rings, maelstroms, and Calm fronts.
            - **🤖 Mecha Squad Formations & Colossal Mobile Armor:** Vinculados agile 3-unit wings, 4-unit EW diamond squads, 5-unit choral swarms, and the colossal Mobile Armor *Seraph-Prime* with autonomous funnels.
            - **🏔 3D Battlefield Landmarks & Altitude Tactics:** Fight around Bastion-7, the Crystal Chasm (+16m altitude dive attacks), the rotating Genesis Ring, Smelter Vulcan-3, and the Eye of the Maelstrom.
            - **🏅 Campaign Save & Veteran Ace Progression:** Persistent promotions carry forward between stages.

            ### 🎮 Quick Start:
            1. Download `Barlovento.zip` attached below.
            2. Extract files into a folder.
            3. Run `Barlovento.exe`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
