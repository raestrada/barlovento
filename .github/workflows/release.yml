name: Publish Game Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.5.0-alpha)'
        required: false
        default: 'v0.5.0-alpha'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "BARLOVENTO ${{ github.event.inputs.tag_name || github.ref_name }} (Windows 64-bit)"
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## 🚀 BARLOVENTO v0.5.0-alpha Build — Grand Fleet & Multi-Front Warfare Overhaul

            ### ✨ Highlights:
            - **⚔ Grand Fleet Warfare & Multi-Front Scaling (Up to 15 vs 16 Ships):** All 36 campaign stages across the 3 civilizations have been overhauled from introductory tactical duels to epic fleet battles with up to 15 player units divided into distinct tactical battle groups (Center Line, Port Strike Wings, Starboard Flanks, High-Altitude Dive Vectors, and Rear Station Defense).
            - **🌌 Varied Battle Topography & Off-Center Landmarks:** Battles take place across diverse celestial terrain: dense Basalt Gorges, orbital Caldera Reefs, tactical Asteroid Archipelago cover, and vast Open Void dogfight zones with rear defense stations and deep fortress assaults.
            - **🤖 Authentic 3D Gundam Mobile Armor & Platoons:** Complete visual overhaul of the Vinculados *Seraph-Prime* Colossus Mobile Armor, *Aegis* Anchor, and *Cradle* Carrier Ark with sculpted head anatomies, golden V-fins, pulsing chest soul reactors, 4 seraph shield-binder wings, and beam funnels.
            - **🎨 Complete AAA Visual Suite:** Dedicated 16:9 stage briefings, panoramic 3D landmarks, faction selection cards, Ace hero portraits, and three-faction key art splash.
            - **🛠 Developer / God Mode Console (`Ctrl+Shift+D`):** Instant debug panel with damage immunity (God Mode), stage jumping across all 36 stages, AP manipulation, and real-time victory triggers.
            - **🎵 Multi-Track Symphonic OST:** High-fidelity classical and symphonic space themes dynamically scoring each faction's campaign.

            ### 🎮 Quick Start:
            1. Download `Barlovento.zip` attached below.
            2. Extract files into a folder.
            3. Run `Barlovento.exe`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
