name: Publish Game Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.4.0-alpha)'
        required: false
        default: 'v0.4.0-alpha'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "BARLOVENTO ${{ github.event.inputs.tag_name || github.ref_name }} (Windows 64-bit)"
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## 🚀 BARLOVENTO v0.4.0-alpha Build

            ### ✨ Highlights:
            - **⚔ Full 36-Stage Campaign (12 per Faction):** Play through all 12 stages across the Armada of Acero, The Vinculados, and La Marea Libre, from introductory tutorials through the final clímax against The Calm!
            - **🎨 9 Cinematic Act Briefing Artworks (16:9):** Dedicated concept art illustrations for Act I, Act II, and Act III for all three civilizations.
            - **🤖 Complete Expanded Unit Rosters:** Command the Colossus Mobile Armor *Seraph-Prime* with fin funnels, the Supreme Juggernaut *CNS Imperator*, the Heavy Siege Monitor *Crucible*, and the Colossal *Void Leviathan*.
            - **🌌 Dynamic Strategic Naval Charts:** Grid topologies scaling up to 16×12 sectors with Calm fronts, conduits, spires, and vortices.
            - **🏅 Campaign Save & Veteran Ace Progression:** Persistent promotions carry forward between all 12 stages.

            ### 🎮 Quick Start:
            1. Download `Barlovento.zip` attached below.
            2. Extract files into a folder.
            3. Run `Barlovento.exe`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
